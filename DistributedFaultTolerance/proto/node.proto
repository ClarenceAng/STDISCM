syntax = "proto3";

package enrollsys;

// Every backend node serves this next to the standard grpc.health.v1.Health service,
// so the status page can show each node's database connection pools.
service NodeInfo {
  rpc GetInfo(GetInfoRequest) returns (GetInfoReply);
}

message PoolStats {
  string name = 1;            // "primary" or "standby"
  int32 max_size = 2;
  int32 open = 3;             // connections that exist, idle plus lent out
  int32 in_use = 4;
  int32 idle = 5;
  int64 connections_made = 6;
  int64 connect_failures = 7;
  int64 checkouts = 8;        // times a request borrowed a connection
  int64 reused = 9;           // checkouts served by an idle connection, with no new connection made
  int64 waited = 10;          // checkouts that had to wait because all max_size were lent out
  int64 wait_timeouts = 11;
  int64 discarded = 12;       // connections thrown away because they broke or sat idle too long
  string last_host = 13;      // database node the newest connection went to
  string last_error = 14;
}

message GetInfoRequest {}

message GetInfoReply {
  string node = 1;
  int64 started_at = 2;       // Unix seconds
  repeated PoolStats pools = 3;
}
